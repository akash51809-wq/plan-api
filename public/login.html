<!doctype html>
<html lang="en" class="layout-wide customizer-hide" data-assets-path="assets/" data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Login - PlanAPI Live Portal | Sneat</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    <link rel="stylesheet" href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="assets/vendor/css/pages/page-auth.css" />

    <!-- Helpers -->
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/js/config.js"></script>
    <style>
      .otp-digit-input {
        text-align: center;
        font-size: 1.6rem !important;
        letter-spacing: 10px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <!-- Content -->
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <!-- Login Card -->
          <div class="card px-sm-6 px-0 shadow-sm border">
            <div class="card-body">
              <!-- Logo -->
              <div class="app-brand justify-content-center mb-6">
                <a href="index.html" class="app-brand-link gap-2">
                  <span class="app-brand-logo demo">
                    <span class="text-primary">
                      <i class="fa-solid fa-bolt-lightning fa-2x"></i>
                    </span>
                  </span>
                  <span class="app-brand-text demo text-heading fw-bold">PlanAPI</span>
                </a>
              </div>
              <!-- /Logo -->
              <h4 class="mb-1">Welcome to PlanAPI! 👋</h4>
              <p class="mb-6 text-muted">Please sign in with your mobile number</p>

              <!-- Step 1: Mobile -->
              <div id="login-step-1">
                <div class="mb-4">
                  <label for="login-mobile" class="form-label">Registered Mobile Number</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa-brands fa-whatsapp text-success"></i> +91</span>
                    <input type="tel" class="form-control" id="login-mobile" placeholder="10-digit mobile" maxlength="10" autofocus />
                  </div>
                </div>

                <button class="btn btn-primary d-grid w-100" id="btn-login-send">
                  <i class="bx bxl-whatsapp me-1"></i> Send Login OTP
                </button>
              </div>

              <!-- Step 2: OTP -->
              <div id="login-step-2" style="display: none;">
                <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
                  <i class="bx bx-check-circle me-2"></i>
                  <div>OTP sent to WhatsApp <strong id="login-display-mobile"></strong></div>
                </div>

                <div class="mb-4">
                  <label for="login-otp" class="form-label">Enter 6-Digit OTP</label>
                  <input type="text" class="form-control otp-digit-input" id="login-otp" placeholder="••••••" maxlength="6" autofocus />
                </div>

                <button class="btn btn-success d-grid w-100 mb-3" id="btn-login-verify">
                  <i class="bx bx-log-in me-1"></i> Verify & Sign In
                </button>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-4">
                <p class="mb-0">
                  <span>New user?</span>
                  <a href="register.html"><span>Create account</span></a>
                </p>
                <a href="admin-login.html" class="text-danger small"><i class="bx bx-shield-quarter"></i> Admin Login</a>
              </div>
            </div>
          </div>
          <!-- /Login Card -->
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastNotification" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Hello!</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <!-- Core JS -->
    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/libs/popper/popper.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="assets/vendor/js/menu.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
      let currentPendingMobile = '';

      function showToast(msg, bg = 'bg-primary') {
        const toastEl = document.getElementById('toastNotification');
        toastEl.className = `toast align-items-center text-white ${bg} border-0`;
        document.getElementById('toastMessage').innerText = msg;
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
      }

      async function requestLoginOTP() {
        const mobile = document.getElementById('login-mobile').value.trim().replace(/\D/g, '');
        const btn = document.getElementById('btn-login-send');

        if (mobile.length !== 10) {
          showToast('Please enter a valid 10-digit mobile number.', 'bg-danger');
          return;
        }

        currentPendingMobile = mobile;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Sending OTP...';

        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobile, type: 'login' })
          });
          const data = await res.json();
          if (data.success) {
            showToast('OTP sent to your WhatsApp number!', 'bg-success');
            document.getElementById('login-step-1').style.display = 'none';
            document.getElementById('login-step-2').style.display = 'block';
            document.getElementById('login-display-mobile').innerText = `+91 ${mobile}`;
          } else {
            showToast(data.message || 'Failed to send OTP.', 'bg-danger');
          }
        } catch (e) {
          showToast('Network error while requesting login OTP.', 'bg-danger');
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="bx bxl-whatsapp me-1"></i> Send Login OTP';
        }
      }

      async function verifyLoginOTP() {
        const otp = document.getElementById('login-otp').value.trim();
        const btn = document.getElementById('btn-login-verify');

        if (otp.length !== 6) {
          showToast('Please enter the 6-digit OTP.', 'bg-danger');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Verifying...';

        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobile: currentPendingMobile, otp })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('planapi_user', JSON.stringify(data.user));
            showToast('Login successful! Redirecting...', 'bg-success');
            window.location.replace('dashboard.html');
          } else {
            showToast(data.message || 'Invalid OTP.', 'bg-danger');
          }
        } catch (e) {
          showToast('Error during login.', 'bg-danger');
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="bx bx-log-in me-1"></i> Verify & Sign In';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const btnSend = document.getElementById('btn-login-send');
        if (btnSend) btnSend.addEventListener('click', requestLoginOTP);

        const btnVerify = document.getElementById('btn-login-verify');
        if (btnVerify) btnVerify.addEventListener('click', verifyLoginOTP);

        const mobileInput = document.getElementById('login-mobile');
        if (mobileInput) {
          mobileInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') requestLoginOTP();
          });
        }

        const otpInput = document.getElementById('login-otp');
        if (otpInput) {
          otpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyLoginOTP();
          });
        }
      });
    </script>
  </body>
</html>
